  <rect x="312" y="284" width="256" height="64" class="line" stroke-width="1.2"/>
  <text x="324" y="314.0" font-size="13" font-weight="700">Postgres + RLS</text>
  <text x="324" y="331.0" font-size="10.5" class="muted">row-level policies</text>
  <rect x="590" y="284" width="230" height="64" class="line" stroke-width="1.2"/>
  <text x="602" y="314.0" font-size="13" font-weight="700">Edge Functions</text>
  <text x="602" y="331.0" font-size="10.5" class="muted">Deno · server logic</text>

  <!-- hidden line: image uploads pass behind the backend straight to storage -->
  <path d="M342,160 L342,236 L301,236 L301,446" class="hidden" marker-end="url(#arrow)"/>
  <text x="293" y="420" font-size="10" text-anchor="end" class="muted">signed PUT · images</text>

