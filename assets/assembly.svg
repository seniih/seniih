  <text x="162" y="473.0" font-size="13" font-weight="700">Cloudflare R2</text>
  <text x="162" y="490.0" font-size="10.5" class="muted">listing images</text>
  <rect x="560" y="446" width="270" height="58" class="line" stroke-width="1.2"/>
  <text x="572" y="473.0" font-size="13" font-weight="700">Firebase Cloud Messaging</text>
